name: Build

# Builds turso_sdk_kit.dll with fts for Windows ARM64 and x64 and smoke-tests each on its own architecture through the
# stock .NET provider. It publishes both DLLs plus SHA256SUMS as a GitHub Release when:
# - main gets a turso.version that has no release yet (it creates v<turso>-fts.1 itself), or
# - someone pushes a v<turso>-fts.<n> tag by hand, which is how a rebuild of the same Turso version ships.
on:
  push:
    branches: [main]
    tags: ["v*-fts.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Two pushes to main must not both try to create the same release; superseded pull request runs are cancelled.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Turso's Windows images need the MSVC compiler named explicitly (see Turso's dotnet-publish workflow).
  CC_x86_64_pc_windows_msvc: cl.exe

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      turso: ${{ steps.read.outputs.turso }}
      release: ${{ steps.read.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        name: Read the Turso version and decide whether this run publishes a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < turso.version)"
          echo "turso=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # A hand-pushed tag publishes itself, but only for the version this commit builds.
            tag="${GITHUB_REF#refs/tags/}"
            [[ "$tag" == "v$version-fts."* ]] || { echo "Tag $tag does not match turso.version $version"; exit 1; }
            echo "release=$tag" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            # A version with no published release gets this build released automatically. A tag alone doesn't count
            # (a hand-pushed tag's build can fail, or its release can be deleted), so the check is on releases. A leftover
            # tag points at another commit, so the release takes the next unused number on this commit instead of reusing it.
            pattern="^v${version//./\\.}-fts\.[0-9]+$"
            released="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName' | grep -E "$pattern" || true)"
            if [[ -z "$released" ]]; then
              highest="$(git ls-remote --tags origin "refs/tags/v$version-fts.*" | sed -E 's#.*-fts\.([0-9]+)(\^\{\})?$#\1#' | sort -n | tail -n 1)"
              echo "release=v$version-fts.$(( ${highest:-0} + 1 ))" >> "$GITHUB_OUTPUT"
            fi
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            target: x86_64-pc-windows-msvc
          - rid: win-arm64
            target: aarch64-pc-windows-msvc
    # Both build on x64, as Turso's own workflow does; ARM64 is cross-compiled with the MSVC ARM64 tools.
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Put the MSVC compiler on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vcvarsall = & $vswhere -latest -products * -find 'VC\Auxiliary\Build\vcvarsall.bat' | Select-Object -First 1
          $settings = & $env:ComSpec /c "call `"$vcvarsall`" x64 >nul && set"
          foreach ($setting in $settings) {
            $separator = $setting.IndexOf('=')
            if ($separator -lt 1) { continue }
            $name = $setting.Substring(0, $separator)
            $value = $setting.Substring($separator + 1)
            if ($name -eq 'PATH') { Add-Content $env:GITHUB_PATH ($value.Split(';') | Where-Object { $_ }) }
            elseif ($name -in @('INCLUDE', 'LIB', 'LIBPATH')) { Add-Content $env:GITHUB_ENV "$name=$value" }
          }

      - name: Build turso_sdk_kit.dll with fts
        shell: pwsh
        run: ./build/Build-TursoNative.ps1 -Version ${{ needs.version.outputs.turso }} -Target ${{ matrix.target }} -OutDir out/${{ matrix.rid }}

      - uses: actions/upload-artifact@v7
        with:
          name: turso_sdk_kit-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/turso_sdk_kit.dll
          if-no-files-found: error

  smoke:
    needs: [version, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-2025
          - rid: win-arm64
            os: windows-11-arm
    # Each DLL runs on its own architecture, so the ARM64 library is really loaded and exercised.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: turso_sdk_kit-${{ matrix.rid }}
          path: native

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run full-text search through Turso.Data.Sqlite
        shell: pwsh
        run: dotnet run --project smoke/FtsSmoke.csproj -r ${{ matrix.rid }} -p:TursoVersion=${{ needs.version.outputs.turso }} -p:NativeLibrary=${{ github.workspace }}/native/turso_sdk_kit.dll

  release:
    if: needs.version.outputs.release != ''
    needs: [version, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.release }}
      TURSO: ${{ needs.version.outputs.turso }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Name the DLLs by runtime and hash them
        shell: bash
        run: |
          mkdir release
          for rid in win-arm64 win-x64; do
            cp "artifacts/turso_sdk_kit-$rid/turso_sdk_kit.dll" "release/turso_sdk_kit-$rid.dll"
          done
          # Turso is MIT licensed; its notice travels with the binaries.
          curl -fsSL "https://raw.githubusercontent.com/tursodatabase/turso/v$TURSO/LICENSE.md" -o release/TURSO-LICENSE.md
          (cd release && sha256sum *.dll > SHA256SUMS)
          cat release/SHA256SUMS

      # --target creates the tag on the built commit when this run came from main; a hand-pushed tag already exists.
      # A tag made with the workflow token starts no second run, so the DLLs are never built twice.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes "turso_sdk_kit.dll built from Turso v$TURSO with turso_core/fts and the index method enabled. Verify downloads against SHA256SUMS."
